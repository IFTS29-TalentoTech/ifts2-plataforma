name: CI

on:
  pull_request:
  push:
    branches: [main]
  # El job `e2e` (Cypress completo, ~15 min) no corre en cada PR: se lanza a mano desde la pestaña
  # Actions ("Run workflow") antes de una entrega o un release. Local: `pnpm e2e`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ifts2
          POSTGRES_PASSWORD: ifts2
          POSTGRES_DB: ifts2_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ifts2 -d ifts2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Valores de prueba, sin secretos reales
      DATABASE_URL: postgresql://ifts2:ifts2@localhost:5433/ifts2_test
      TEST_DATABASE_URL: postgresql://ifts2:ifts2@localhost:5433/ifts2_test
      APP_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      APP_ENCRYPTION_KEY: ZGV2LW9ubHktZXhhbXBsZS1rZXktMzItYnl0ZXMhISE=
      STORAGE_PROVIDER: memory
      MAILER_PROVIDER: console
      INSTAGRAM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Autorizar la base descartable del servicio de pruebas
        env:
          PGPASSWORD: ifts2
        run: psql -h localhost -p 5433 -U ifts2 -d ifts2_test -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE ifts2_test IS 'ifts2:disposable-test-database'"
      - run: pnpm test
      - run: pnpm build
      - name: Portadas públicas con API e imágenes simuladas (sin base de datos)
        run: pnpm test:covers
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: portadas-screenshots
          path: apps/web/.next/covers-screenshots

  # Cypress (suite completa + accesibilidad) contra la web compilada. Sin secretos. Solo manual.
  e2e:
    # Rama descartable: ejecutar E2E realmente en este PR de integración.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ifts2
          POSTGRES_PASSWORD: ifts2
          POSTGRES_DB: ifts2
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ifts2 -d ifts2"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ifts2:ifts2@localhost:5433/ifts2
      APP_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      APP_ENCRYPTION_KEY: ZGV2LW9ubHktZXhhbXBsZS1rZXktMzItYnl0ZXMhISE=
      STORAGE_SIGNING_SECRET: ci-disposable-storage-signing-secret
      REVALIDATE_SECRET: ci-disposable-revalidation-secret
      SEED_MODE: demo
      SEED_ADMIN_EMAIL: admin@ifts2.local
      SEED_ADMIN_PASSWORD: Cambiame-123!
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Suite E2E completa con base propia y web degradada
        run: |
          touch .env
          pnpm e2e:full
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-screenshots
          path: |
            apps/web/cypress/screenshots
            .e2e-logs
