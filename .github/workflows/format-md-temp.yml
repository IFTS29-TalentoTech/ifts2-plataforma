name: Formateo temporal documentación A03
on:
  push:
    branches: [chore/prettier-documentacion-a03]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/avance.md packages/shared/README.md
      - name: Confirmar cambios estrictamente de formato
        run: |
          git diff --check
          git add -- docs/avance.md packages/shared/README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: aplica Prettier a dos archivos existentes"
            git push
          fi
