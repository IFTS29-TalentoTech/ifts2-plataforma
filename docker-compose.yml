# Base de datos de desarrollo del proyecto. No toca ningún otro contenedor.
services:
  ifts2-db:
    image: postgres:17
    container_name: ifts2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ifts2
      POSTGRES_PASSWORD: ifts2
      POSTGRES_DB: ifts2
    ports:
      - "5433:5432"
    volumes:
      - ifts2-db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifts2 -d ifts2"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ifts2-db-data:
    name: ifts2-db-data
